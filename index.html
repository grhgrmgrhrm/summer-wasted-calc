<script>
    // ── Service Worker + уведомления ──────────────────────────────
    let swRegistration = null;

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
            try {
                swRegistration = await navigator.serviceWorker.register('./sw.js');
                console.log('SW registered:', swRegistration.scope);
                await setupNotifications();
            } catch (err) {
                console.log('SW error:', err);
            }
        });
    }

    async function setupNotifications() {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'default') {
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') return;
        }
        if (Notification.permission !== 'granted') return;
        scheduleNotification();
    }

    function scheduleNotification() {
        const now = new Date();
        const target = new Date();
        target.setHours(21, 0, 0, 0);
        if (now >= target) target.setDate(target.getDate() + 1);

        const msUntilNotif = target - now;
        const lastScheduled = localStorage.getItem('notifScheduledFor');
        const targetStr = target.toISOString();
        if (lastScheduled === targetStr) return;
        localStorage.setItem('notifScheduledFor', targetStr);

        console.log(`Уведомление через ${Math.round(msUntilNotif / 60000)} мин`);

        setTimeout(async () => {
            const sw = await navigator.serviceWorker.ready;
            sw.active.postMessage({ type: 'SHOW_NOTIFICATION' });
            localStorage.removeItem('notifScheduledFor');
            scheduleNotification();
        }, msUntilNotif);
    }

    // ── Данные ───────────────────────────────────────────────────
    const TOTAL_SUMMER_DAYS = 92;
    const currentYear = new Date().getFullYear();
    // 2. Начало лета: 1 июня, 00:00:00
    const summerStart = new Date(currentYear, 5, 1, 0, 0, 0);

    // 3. Конец лета: 31 августа, 23:59:59
    const summerEnd = new Date(currentYear, 7, 31, 23, 59, 59, 999);

    const OLD_KEY = 'proebSummer2026';
    const NEW_KEY = 'summerTracker2026';
    let data = JSON.parse(localStorage.getItem(NEW_KEY));
    if (!data) {
        const oldData = localStorage.getItem(OLD_KEY);
        if (oldData) {
            data = JSON.parse(oldData);
            localStorage.setItem(NEW_KEY, JSON.stringify(data));
            localStorage.removeItem(OLD_KEY);
        } else {
            data = {};
        }
    }

    function saveData() {
        localStorage.setItem(NEW_KEY, JSON.stringify(data));
    }

    const CATEGORIES = {
        study: { label: 'Обучение', emoji: '📚', color: 'bg-indigo-600/30 text-indigo-400 border-indigo-500/50', barColor: 'bg-indigo-500' },
        sport: { label: 'Спорт', emoji: '🏃‍♂️', color: 'bg-emerald-600/30 text-emerald-400 border-emerald-500/50', barColor: 'bg-emerald-500' },
        work: { label: 'Работа', emoji: '💼', color: 'bg-amber-600/30 text-amber-400 border-amber-500/50', barColor: 'bg-amber-500' },
        health: { label: 'Здоровье', emoji: '🧘', color: 'bg-rose-600/30 text-rose-400 border-rose-500/50', barColor: 'bg-rose-500' },
        hobby: { label: 'Хобби', emoji: '🎨', color: 'bg-purple-600/30 text-purple-400 border-purple-500/50', barColor: 'bg-purple-500' },
        other: { label: 'Разное', emoji: '✨', color: 'bg-slate-600/30 text-slate-400 border-slate-500/50', barColor: 'bg-slate-500' }
    };
    let selectedCategory = 'other';

    function selectCategory(key) {
        selectedCategory = key;
        Object.keys(CATEGORIES).forEach(k => {
            const btn = document.getElementById(`cat-btn-${k}`);
            if (btn) {
                if (k === key) {
                    btn.className = `text-xs px-3 py-1.5 rounded-full border transition-all ${CATEGORIES[k].color} border-orange-500 scale-105 font-bold`;
                } else {
                    btn.className = `text-xs px-3 py-1.5 rounded-full border transition-all bg-slate-800 border-slate-700 text-slate-400 hover:text-white`;
                }
            }
        });
    }

    function getLocalDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function getDays() {
        let days = [];
        // Начинаем с 1 июня
        let current = new Date(summerStart.getFullYear(), summerStart.getMonth(), summerStart.getDate());

        // Пока не перешагнули 31 августа
        while (current <= summerEnd) {
            // Используем новую функцию вместо .toISOString()
            days.push(getLocalDateString(current));
            current.setDate(current.getDate() + 1);
        }
        return days;
    }

    function isToday(dateStr) {
        return dateStr === getLocalDateString(new Date());
    }

    function isPast(dateStr) {
        return dateStr < getLocalDateString(new Date());
    }

    function getRemainingDays() {
        const now = new Date();

        if (now < summerStart) return TOTAL_SUMMER_DAYS;

        if (now > summerEnd) return 0;

        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfSummer = new Date(summerStart.getFullYear(), summerStart.getMonth(), summerStart.getDate());

        const diffTime = todayStart - startOfSummer;
        const daysPassed = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        return TOTAL_SUMMER_DAYS - daysPassed;
    }

    function autoMarkWasted() {
        const days = getDays();
        const todayStr = getLocalDateString(new Date()); // исправлено здесь
        days.forEach(date => {
            if (!data[date]) data[date] = { tasks: [], wasted: false };
            if (isPast(date)) {
                data[date].wasted = data[date].tasks.length === 0;
            } else if (date === todayStr) {
                data[date].wasted = false;
            }
        });
        saveData();
    }

    function toggleTask(date, index) {
        if (!isToday(date) || !data[date]) return;
        data[date].tasks[index].done = !data[date].tasks[index].done;
        saveData();
        render();
    }

    function addTask(date) {
        if (!isToday(date)) return;
        const input = document.getElementById(`input-${date}`);
        const text = input.value.trim();
        if (!text) return;
        if (!data[date]) data[date] = { tasks: [], wasted: false };
        data[date].tasks.push({ text, done: true, category: selectedCategory });
        input.value = '';
        selectedCategory = 'other';
        saveData();
        render();
    }

    function deleteTask(date, index) {
        if (!isToday(date)) return;
        if (confirm('Удалить задачу?')) {
            data[date].tasks.splice(index, 1);
            saveData();
            render();
        }
    }

    function calculateStats() {
        const days = getDays();
        const todayStr = new Date().toISOString().split('T')[0];
        const completedDays = days.filter(date => date < todayStr);

        let wasted = 0, productive = 0, totalTasks = 0;
        completedDays.forEach(date => {
            const d = data[date] || { tasks: [] };
            totalTasks += d.tasks.length;
            if (d.tasks.length === 0) wasted++;
            else productive++;
        });

        let categoryStats = {};
        Object.keys(CATEGORIES).forEach(k => categoryStats[k] = 0);
        days.forEach(date => {
            const d = data[date];
            if (d && d.tasks) {
                d.tasks.forEach(task => {
                    const cat = task.category || 'other';
                    if (categoryStats[cat] !== undefined) {
                        categoryStats[cat]++;
                    }
                });
            }
        });

        const totalCompletedDays = completedDays.length;
        const productivePercent = Math.round((productive / TOTAL_SUMMER_DAYS) * 100);
        return { wasted, productive, totalCompletedDays, productivePercent, totalTasks, categoryStats };
    }

    // ── Мотивация ────────────────────────────────────────────────
    function getMotivation(percent, completedDays) {
        if (completedDays === 0) return { text: 'Лето началось. Не облажайся.', color: 'text-slate-400' };
        if (percent === 100)   return { text: '🏆 ЛЕГЕНДА. Лето не потеряно.', color: 'text-yellow-400' };
        if (percent >= 81)     return { text: '🔥 Ты красава. Почти идеальное лето.', color: 'text-green-400' };
        if (percent >= 61)     return { text: '💪 Неплохо! Лето ещё не слито.', color: 'text-green-500' };
        if (percent >= 41)     return { text: '😐 Уже что-то. Но можешь лучше.', color: 'text-yellow-400' };
        if (percent >= 21)     return { text: '😬 Маловато будет. Соберись.', color: 'text-orange-400' };
        return { text: '😡 Ты вообще что себе думаешь? Всё лето ничего не делать?', color: 'text-red-400' };
    }

    function pluralize(n, forms) {
        let nAbs = Math.abs(n) % 100;
        let n1 = nAbs % 10;
        if (nAbs > 10 && nAbs < 20) return forms[2]; // дел / дней
        if (n1 > 1 && n1 < 5) return forms[1];       // дела / дня
        if (n1 === 1) return forms[0];               // дело / день
        return forms[2];
    }

    // ── Рендер ───────────────────────────────────────────────────
    function render() {
        autoMarkWasted();

        const s = calculateStats();
        const remaining = getRemainingDays();

        // Мотивация
        const motiv = getMotivation(s.productivePercent, s.totalCompletedDays);
        const motivEl = document.getElementById('motivation');
        motivEl.textContent = motiv.text;
        motivEl.className = `text-base sm:text-lg mt-2 italic opacity-90 ${motiv.color}`;

        // Оставшиеся дни
        const dayLabel = pluralize(remaining, ['день', 'дня', 'дней']);
        document.getElementById('remaining-days').innerHTML = `
          <div class="inline-flex items-center gap-3 bg-slate-900 rounded-2xl px-5 sm:px-6 py-3">
            <div>
              <div class="text-3xl font-bold text-amber-300">${remaining}</div>
              <div class="text-xs uppercase tracking-widest opacity-60 -mt-1">${dayLabel} лета осталось</div>
            </div>
          </div>`;

        // Прогрессбар
        const greenWidth = s.productivePercent;
        document.getElementById('progress-section').innerHTML = `
          <div class="mb-2 text-sm opacity-75 text-center sm:text-left">Прогресс лета (92 дня)</div>
          <div class="progress-bar">
            <div class="progress-fill progress-green" style="width: ${greenWidth}%;"></div>
          </div>
          <div class="flex justify-between text-sm mt-3">
            <div class="flex items-center gap-2">
              <span class="text-green-400 font-bold">${s.productive}</span>
              <span class="text-green-400/70">продуктивных</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-red-400/70">потеряно</span>
              <span class="text-red-400 font-bold">${s.wasted}</span>
            </div>
          </div>`;

        // Статистика
        let categoriesHtml = '';
        const totalCatTasks = Object.values(s.categoryStats).reduce((a, b) => a + b, 0);
        if (totalCatTasks > 0) {
            categoriesHtml = `
              <div class="mt-4 border-t border-slate-700 pt-4">
                <div class="text-sm opacity-75 mb-3 text-left">Распределение по сферам:</div>
                <div class="space-y-2">
                  ${Object.entries(CATEGORIES).map(([key, cat]) => {
                      const count = s.categoryStats[key] || 0;
                      const percent = totalCatTasks > 0 ? Math.round((count / totalCatTasks) * 100) : 0;
                      return `
                        <div>
                          <div class="flex justify-between text-xs mb-1">
                            <span class="opacity-95">${cat.emoji} ${cat.label}</span>
                            <span class="font-bold text-slate-300">${count} (${percent}%)</span>
                          </div>
                          <div class="h-1.5 bg-slate-900 rounded-full overflow-hidden">
                            <div class="h-full ${cat.barColor} transition-all duration-500" style="width: ${percent}%;"></div>
                          </div>
                        </div>
                      `;
                  }).join('')}
                </div>
              </div>`;
        }

        const completedDaysLabel = pluralize(s.totalCompletedDays, ['день', 'дня', 'дней']);
        const totalTasksLabel = pluralize(s.totalTasks, ['задача', 'задачи', 'задач']);

        document.getElementById('stats').innerHTML = `
          <div class="flex justify-between items-center p-4 bg-red-900/30 rounded-xl">
            <span class="text-red-400">Потеряно дней:</span>
            <span class="text-3xl font-bold text-red-400">${s.wasted}</span>
          </div>
          <div class="flex justify-between items-center p-4 bg-green-900/30 rounded-xl">
            <span class="text-green-400">Продуктивных дней:</span>
            <span class="text-3xl font-bold text-green-400">${s.productive}</span>
          </div>
          <div class="text-center text-sm opacity-70 mt-2">
            Завершённых дней: <span class="font-bold">${s.totalCompletedDays}</span> ${completedDaysLabel}<br>
            Добавлено задач: <span class="font-bold">${s.totalTasks}</span> ${totalTasksLabel}
          </div>
          ${categoriesHtml}`;

        // Список дней
        let html = '';
        getDays().forEach(date => {
            const dayData = data[date] || { tasks: [], wasted: false };
            const isTodayDay = isToday(date);
            const past = isPast(date);
            const taskCount = dayData.tasks.length;

            let dayClass = 'bg-slate-700';
            if (past) dayClass = dayData.wasted ? 'wasted' : 'productive';
            else if (isTodayDay) dayClass = taskCount > 0 ? 'today' : 'bg-slate-700';
            const taskLabel = pluralize(taskCount, ['дело', 'дела', 'дел']);

            html += `
              <div class="${dayClass} ${!isTodayDay ? 'locked' : ''} rounded-xl p-4 transition-all">
                <div class="flex justify-between items-center mb-3">
                  <div class="font-mono text-base sm:text-lg ${isTodayDay ? 'text-orange-400 font-bold' : ''}">
                    ${new Date(date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                    ${isTodayDay ? ' ← СЕГОДНЯ. ДОБАВЬ АКТИВНОСТЬ!' : past ? ' (прошёл)' : ' (будет)'}
                  </div>
                  <div class="text-sm opacity-75">${taskCount} ${taskLabel}</div>
                </div>
                <div class="space-y-2 mb-4">
                  ${dayData.tasks.map((task, i) => `
                    <div class="flex items-center gap-3 bg-black/30 p-3 rounded-lg">
                      <span class="text-lg flex-shrink-0" title="${CATEGORIES[task.category || 'other'].label}">
                        ${CATEGORIES[task.category || 'other'].emoji}
                      </span>
                      <span class="flex-1 text-white">${task.text}</span>
                      ${isTodayDay ? `
                        <button onclick="deleteTask('${date}', ${i})" class="text-red-400 hover:text-red-500">
                          <i class="fa-solid fa-trash"></i>
                        </button>` : ''}
                    </div>`).join('')}
                </div>
                ${isTodayDay ? `
                <div class="flex flex-wrap gap-2 mb-3">
                  ${Object.entries(CATEGORIES).map(([key, cat]) => `
                    <button id="cat-btn-${key}" onclick="selectCategory('${key}')"
                            class="text-xs px-3 py-1.5 rounded-full border transition-all ${selectedCategory === key ? cat.color + ' border-orange-500 scale-105 font-bold' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'}">
                      ${cat.emoji} ${cat.label}
                    </button>
                  `).join('')}
                </div>
                <div class="flex flex-col sm:flex-row gap-2">
                  <input id="input-${date}" type="text" placeholder="Что планируешь / сделал?"
                         class="flex-1 bg-slate-900 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500"
                         onkeypress="if(event.key === 'Enter') addTask('${date}')">
                  <button onclick="addTask('${date}')"
                          class="bg-orange-500 hover:bg-orange-600 px-8 py-2 rounded-lg font-bold">+</button>
                </div>` : ''}
              </div>`;
        });

        document.getElementById('days-list').innerHTML = html;
    }

    function getShareText(s) {
        const siteUrl = 'https://grhgrmgrhrm.github.io/summer-wasted-calc/';
        return `☀️ Моё лето 2026
─────────────────────
а ты сколько дней лета уже потерял? 👀
👇
🔗 ${siteUrl}`;
    }

    function renderShareButtons() {
        const s = calculateStats();
        const text = getShareText(s);
        const encoded = encodeURIComponent(text);

        const buttons = [
            {
                label: 'Telegram',
                icon: 'fa-brands fa-telegram',
                color: 'bg-sky-500 hover:bg-sky-600',
                url: `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`
            },
            {
                label: 'WhatsApp',
                icon: 'fa-brands fa-whatsapp',
                color: 'bg-green-600 hover:bg-green-700',
                url: `https://wa.me/?text=${encoded}`
            },
            {
                label: 'Viber',
                icon: 'fa-brands fa-viber',
                color: 'bg-purple-600 hover:bg-purple-700',
                url: `viber://forward?text=${encoded}`
            },
            {
                label: 'Instagram',
                icon: 'fa-brands fa-instagram',
                color: 'bg-pink-600 hover:bg-pink-700',
                action: 'copy'
            }
        ];

        document.getElementById('share-buttons').innerHTML = buttons.map(b => `
            <a ${b.action === 'copy'
            ? `href="#" onclick="copyForInstagram(); return false;"`
            : `href="${b.url}" target="_blank" rel="noopener"`}
               class="${b.color} flex items-center justify-center gap-3 px-4 py-3 rounded-xl text-white font-medium transition-all">
                <i class="${b.icon} text-lg w-5 text-center"></i>
                <span>${b.label}</span>
                ${b.action === 'copy' ? '<span class="ml-auto text-xs opacity-70">скопировать</span>' : ''}
            </a>`).join('');
    }

    function copyForInstagram() {
        const s = calculateStats();
        const text = getShareText(s);
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('#share-buttons a:last-child');
            const span = btn.querySelector('span:last-child');
            span.textContent = '✓ скопировано!';
            setTimeout(() => { span.textContent = 'скопировать'; }, 2000);
        });
    }

    render();
    renderShareButtons();
</script>
</body>
</html>
